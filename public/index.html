<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit Style Cloud Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style> 
        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            background-color: #0b0e11; 
        } 
    </style>
</head>
<body class="text-[#e7ebed] min-h-screen flex flex-col justify-between">
    
    <!-- Top Navigation -->
    <header class="border-b border-[#2d3139] bg-[#12161a] py-3 px-6">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="text-[#ffb11a] text-xl font-bold tracking-wider">BYBIT</span>
                <span class="text-slate-400 text-xs border-l border-slate-700 pl-2">CLOUD TERMINAL</span>
            </div>
            <!-- ភ្លើងសញ្ញាតភ្ជាប់ VPS ស្អាតសាមញ្ញ -->
            <div class="flex items-center gap-1.5 bg-[#1e2329] px-3 py-1.5 rounded border border-[#2d3139] text-xs font-mono">
                <span id="apiLight" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
                <span id="apiText" class="text-yellow-500 font-semibold">VPS BRIDGE: CONNECTING...</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-grow max-w-lg mx-auto w-full p-4 lg:p-6 space-y-4">
        
        <!-- ប្លុកកំណត់ parameters ជួញដូរ -->
        <div class="bg-[#12161a] border border-[#2d3139] p-5 rounded-lg space-y-4 shadow-lg text-xs">
            <h2 class="text-xs font-bold text-[#ffb11a] uppercase tracking-wider border-b border-[#2d3139] pb-2">⚙️ TRADING PARAMETERS</h2>
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-slate-400 mb-1">Lot Size</label>
                    <input type="number" id="lotSize" value="0.01" step="0.01" class="w-full bg-[#1e2329] border border-[#2d3139] rounded px-3 py-1.5 text-slate-300 focus:outline-none">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">កាត់ចំណេញ TP ($)</label>
                    <input type="number" id="tp_usd" value="0.65" step="0.01" class="w-full bg-[#1e2329] border border-[#2d3139] rounded px-3 py-1.5 text-[#03c087] font-bold focus:outline-none">
                </div>
                <div class="col-span-2">
                    <label class="block text-slate-400 mb-1">កាត់ខាត SL ($)</label>
                    <input type="number" id="sl_usd" value="5.00" step="0.1" class="w-full bg-[#1e2329] border border-[#2d3139] rounded px-3 py-1.5 text-[#f6465d] font-bold focus:outline-none">
                </div>
            </div>

            <div class="flex justify-between items-center pt-2">
                <span class="text-slate-400">ស្ថានភាព EA៖</span>
                <button id="eaToggle" onclick="toggleEA()" class="bg-[#03c087]/10 text-[#03c087] border border-[#03c087]/20 px-3 py-1 rounded text-[10px] font-bold uppercase">ACTIVE</button>
            </div>

            <button id="regBtn" onclick="syncToMT5()" class="w-full bg-[#ffb11a] hover:bg-[#e09600] text-black font-bold py-2.5 rounded text-xs uppercase tracking-wider transition-all transform active:scale-[0.98]">
                💾 SAVE SETTINGS
            </button>
        </div>

    </main>

    <footer class="border-t border-[#2d3139] py-3 text-center text-[10px] text-slate-500 bg-[#12161a]">
        © 2026 BYBIT STYLE CLOUD TERMINAL.
    </footer>

    <script>
        let eaActive = 1;

        function toggleEA() {
            const btn = document.getElementById('eaToggle');
            if (eaActive === 1) { 
                eaActive = 0; 
                btn.innerText = "DISABLED"; 
                btn.className = "bg-[#f6465d]/10 text-[#f6465d] border border-[#f6465d]/20 px-3 py-1 rounded text-[10px] font-bold uppercase"; 
            } else { 
                eaActive = 1; 
                btn.innerText = "ACTIVE"; 
                btn.className = "bg-[#03c087]/10 text-[#03c087] border border-[#03c087]/20 px-3 py-1 rounded text-[10px] font-bold uppercase"; 
            }
        }

        function syncToMT5() {
            const regBtn = document.getElementById('regBtn');
            regBtn.innerText = "SAVING SETTINGS TO CLOUD...";
            regBtn.disabled = true;

            const lot = document.getElementById('lotSize').value;
            const tp = document.getElementById('tp_usd').value;
            const sl = document.getElementById('sl_usd').value;

            fetch('/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accId: "414063265", server: "Exness-MT5Trial6", lot, tp, sl, active: eaActive })
            })
            .then(res => res.text())
            .then(data => {
                regBtn.innerText = "💾 SAVE SETTINGS";
                regBtn.disabled = false;
                alert("រក្សាទុកការកំណត់ជោគជ័យ!");
            });
        }

        // រត់ត្រួតពិនិត្យភ្លើងសញ្ញាតភ្ជាប់រៀងរាល់ ២ វិនាទីម្តង
        setInterval(() => {
            fetch('/api/status')
            .then(res => res.json())
            .then(data => {
                const diff = data.serverTime - data.lastPing;
                const light = document.getElementById('apiLight');
                const text = document.getElementById('apiText');
                
                if (data.lastPing === 0) {
                    light.className = "w-2 h-2 rounded-full bg-yellow-500 animate-pulse";
                    text.innerText = "VPS BRIDGE: CONNECTING...";
                    text.className = "text-yellow-500 font-semibold";
                } else if (diff < 6000) { // បើក្រោម ៦ វិនាទី មានន័យថា MT5 កំពុងភ្ជាប់សកម្ម
                    light.className = "w-2 h-2 rounded-full bg-[#03c087] shadow-lg shadow-[#03c087]/50";
                    text.innerText = "VPS BRIDGE: ACTIVE";
                    text.className = "text-[#03c087] font-semibold";
                } else {
                    light.className = "w-2 h-2 rounded-full bg-[#f6465d] shadow-lg shadow-[#f6465d]/50 animate-pulse";
                    text.innerText = "VPS BRIDGE: FAILED";
                    text.className = "text-[#f6465d] font-semibold";
                }
            })
            .catch(err => {
                const light = document.getElementById('apiLight');
                const text = document.getElementById('apiText');
                light.className = "w-2 h-2 rounded-full bg-[#f6465d] shadow-lg shadow-[#f6465d]/50 animate-pulse";
                text.innerText = "VPS BRIDGE: FAILED";
                text.className = "text-[#f6465d] font-semibold";
            });
        }, 2000);
    </script>
</body>
</html>
