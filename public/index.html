<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Cloud Trading Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kantumruy Pro', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">
    
    <!-- Header -->
    <header class="border-b border-slate-900 bg-slate-900/50 backdrop-blur py-4 px-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400">🏆 MT5 CLOUD CONTROLLER</h1>
            <div id="connectionStatus" class="flex items-center gap-2 bg-slate-950 px-4 py-1.5 rounded-full border border-slate-900">
                <!-- កន្លែងបង្ហាញស្ថានភាពតភ្ជាប់ -->
                <span class="text-sm text-amber-500">កំពុងតភ្ជាប់...</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto w-full p-6">
        
        <!-- ផ្ទាំងបង្ហាញទិន្នន័យគណនី (Telemetry Display) -->
        <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-slate-900/40 border border-slate-900 p-4 rounded-xl text-center">
                <span class="text-xs text-slate-500 uppercase block mb-1">សមតុល្យគណនី (Balance)</span>
                <span id="webBalance" class="text-xl font-bold text-slate-200">$0.00</span>
            </div>
            <div class="bg-slate-900/40 border border-slate-900 p-4 rounded-xl text-center">
                <span class="text-xs text-slate-500 uppercase block mb-1">មូលធនបច្ចុប្បន្ន (Equity)</span>
                <span id="webEquity" class="text-xl font-bold text-slate-200">$0.00</span>
            </div>
            <div class="bg-slate-900/40 border border-slate-900 p-4 rounded-xl text-center">
                <span class="text-xs text-slate-500 uppercase block mb-1">ចំនួនលំដាប់ជួញដូរ (Trades)</span>
                <span id="webPositions" class="text-xl font-bold text-emerald-400">0 Positions</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Security Info -->
            <div class="bg-slate-900/60 border border-slate-900 p-6 rounded-2xl shadow-xl">
                <h2 class="text-lg font-semibold text-slate-300 mb-4 border-b border-slate-800 pb-2">🔑 សោរផ្ទៀងផ្ទាត់គណនី MT5</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">លេខគណនី (MT5 Login ID)</label>
                        <input type="text" id="accId" value="414063265" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-emerald-400 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">ម៉ាស៊ីនបម្រើ (Broker Server)</label>
                        <input type="text" id="server" value="Exness-MT5Trial6" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-300 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
            </div>

            <!-- Parameters -->
            <div class="bg-slate-900/60 border border-slate-900 p-6 rounded-2xl shadow-xl">
                <h2 class="text-lg font-semibold text-slate-300 mb-4 border-b border-slate-800 pb-2">⚙️ កំណត់ប៉ារ៉ាម៉ែត្រជួញដូរ</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">ទំហំ Lot size</label>
                        <input type="number" id="lot" value="0.01" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-300 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Spread អនុញ្ញាត</label>
                        <input type="number" id="spread" value="500" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-300 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">កាត់ចំណេញ TP ($)</label>
                        <input type="number" id="tp" value="0.65" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-emerald-400 font-bold focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">កាត់ខាត SL ($)</label>
                        <input type="number" id="sl" value="5.00" step="0.1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-rose-400 font-bold focus:outline-none">
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-6 bg-slate-900/40 border border-slate-900 p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-slate-300 font-semibold">ស្ថានភាព EA៖</span>
                <button id="eaToggle" onclick="toggleEA()" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-4 py-1.5 rounded-full text-sm font-semibold">សកម្ម (ACTIVE)</button>
            </div>
            <button onclick="syncToMT5()" class="w-full md:w-auto bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-bold px-8 py-3 rounded-xl transform active:scale-95 transition-all">💾 រក្សាទុក & ផ្ញើទៅ MT5 VPS</button>
        </div>
        <div id="statusConsole" class="mt-4 p-3 bg-slate-950/60 rounded-xl border border-slate-900 text-xs text-slate-400 font-mono">រង់ចាំការបញ្ជា...</div>
    </main>

    <footer class="border-t border-slate-900 py-4 px-6 text-center text-xs text-slate-500 bg-slate-950">© 2026 MT5 Remote Controller Bridge.</footer>

    <script>
        let eaActive = 1;

        // មុខងារទាញយកទិន្នន័យគណនី (Telemetry) ពី MT5
        function updateTelemetry() {
            fetch('/get-telemetry')
            .then(res => res.json())
            .then(data => {
                document.getElementById('webBalance').innerText = `$${data.balance}`;
                document.getElementById('webEquity').innerText = `$${data.equity}`;
                document.getElementById('webPositions').innerText = `${data.positions} Positions`;
                
                const statusDiv = document.getElementById('connectionStatus');
                if (data.status === "Active") {
                    statusDiv.innerHTML = `<span class="w-2.5 h-3 bg-emerald-500 rounded-full animate-ping"></span> <span class="text-sm text-emerald-400 font-semibold">ស្ពានតភ្ជាប់ VPS សកម្ម</span>`;
                } else {
                    statusDiv.innerHTML = `<span class="w-2.5 h-3 bg-rose-500 rounded-full"></span> <span class="text-sm text-rose-500 font-semibold">ការតភ្ជាប់បរាជ័យ (Offline)</span>`;
                }
            })
            .catch(err => {
                const statusDiv = document.getElementById('connectionStatus');
                statusDiv.innerHTML = `<span class="w-2.5 h-3 bg-rose-500 rounded-full"></span> <span class="text-sm text-rose-500 font-semibold">ការតភ្ជាប់បរាជ័យ (Error)</span>`;
            });
        }

        // ឱ្យវារត់ស្កែនទាញយកទិន្នន័យរៀងរាល់ ២ វិនាទីម្តង
        setInterval(updateTelemetry, 2000);

        function toggleEA() {
            const btn = document.getElementById('eaToggle');
            if (eaActive === 1) { eaActive = 0; btn.innerText = "បិទ (DISABLED)"; btn.className = "bg-rose-500/20 text-rose-400 border border-rose-500/30 px-4 py-1.5 rounded-full text-sm font-semibold"; }
            else { eaActive = 1; btn.innerText = "សកម្ម (ACTIVE)"; btn.className = "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-4 py-1.5 rounded-full text-sm font-semibold"; }
        }

        function syncToMT5() {
            const accId = document.getElementById('accId').value;
            const server = document.getElementById('server').value;
            const lot = document.getElementById('lot').value;
            const spread = document.getElementById('spread').value;
            const tp = document.getElementById('tp').value;
            const sl = document.getElementById('sl').value;
            
            const statusDiv = document.getElementById('connectionStatus');
            statusDiv.innerHTML = `<span class="text-sm text-amber-500">កំពុងតភ្ជាប់...</span>`;
            document.getElementById('statusConsole').innerText = "កំពុងរក្សាទុកទៅកាន់ Cloud...";
            
            fetch('/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accId, server, lot, tp, sl, active: eaActive, spread })
            })
            .then(res => res.text())
            .then(data => { document.getElementById('statusConsole').innerText = "រក្សាទុកជោគជ័យ! EA ក្នុង MT5 នឹងប្តូរតាមក្នុងរយៈពេល ២ វិនាទី។"; })
            .catch(err => { document.getElementById('statusConsole').innerText = "ការរក្សាទុកបរាជ័យ!"; });
        }
    </script>
</body>
</html>
