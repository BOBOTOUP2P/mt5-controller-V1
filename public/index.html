<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit Style Cloud Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style> 
        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            background-color: #0b0e11; 
        } 
    </style>
</head>
<body class="text-[#e7ebed] min-h-screen flex flex-col justify-between">
    
    <!-- Top Navigation -->
    <header class="border-b border-[#2d3139] bg-[#12161a] py-3 px-6">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="text-[#ffb11a] text-xl font-bold tracking-wider">BYBIT</span>
                <span class="text-slate-400 text-xs border-l border-slate-700 pl-2">CLOUD TERMINAL</span>
            </div>
            <!-- ភ្លើងសញ្ញាតភ្ជាប់ទាំង ២ បែបបង្រួមតូចសាមញ្ញ -->
            <div class="flex flex-wrap gap-4 text-[11px] text-slate-400 font-mono">
                <div class="flex items-center gap-1.5 bg-[#1e2329] px-2.5 py-1 rounded border border-[#2d3139]">
                    <span id="dbLight" class="w-2 h-2 rounded-full bg-emerald-500 shadow-lg shadow-[#03c087]/50"></span>
                    <span id="dbText">DB: ACTIVE</span>
                </div>
                <div class="flex items-center gap-1.5 bg-[#1e2329] px-2.5 py-1 rounded border border-[#2d3139]">
                    <span id="apiLight" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
                    <span id="apiText">VPS BRIDGE: CONNECTING...</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-grow max-w-5xl mx-auto w-full p-4 lg:p-6 space-y-4">
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            
            <!-- ប្លុកកំណត់ Exness (Left Column) -->
            <div class="bg-[#12161a] border border-[#2d3139] p-5 rounded-lg space-y-4 shadow-lg text-xs">
                <h2 class="text-xs font-bold text-[#ffb11a] uppercase tracking-wider border-b border-[#2d3139] pb-2">🔑 EXNESS CONFIGURATION</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-slate-400 mb-1">លេខគណនី Exness MT5 ID</label>
                        <input type="text" id="accId" value="414063265" class="w-full bg-[#1e2329] border border-[#2d3139] rounded px-3 py-2 text-[#ffb11a] focus:outline-none focus:border-[#ffb11a]">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">លេខសម្ងាត់ Exness (Trading Password)</label>
                        <input type="password" id="password_mt5" value="Id168169$" class="w-full bg-[#1e2329] border border-[#2d3139] rounded px-3 py-2 text-slate-300 focus:outline-none focus:border-[#ffb11a]">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-slate-400 mb-1">ប្រព័ន្ធ (Platform)</label>
                            <select id="platform" class="w-full bg-[#1e2329] border border-[#2d3139] rounded px-2.5 py-2 text-slate-300 focus:outline-none">
                                <option value="mt5">MT5 (Default)</option>
                                <option value="mt4">MT4</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">ម៉ាស៊ីនបម្រើ (Server)</label>
                            <input type="text" id="server" value="Exness-MT5Trial6" class="w-full bg-[#1e2329] border border-[#2d3139] rounded px-3 py-2 text-slate-300 focus:outline-none">
                        </div>
                    </div>
                </div>
                <h2 class="text-xs font-bold text-[#ffb11a] uppercase tracking-wider border-b border-[#2d3139] pt-2 pb-2">⚙️ TRADING PARAMETERS</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-400 mb-1">Lot Size</label>
                        <input type="number" id="lotSize" value="0.01" step="0.01" class="w-full bg-[#1e2329] border border-[#2d3139] rounded px-3 py-1.5 text-slate-300 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">Spread Points</label>
                        <input type="number" id="spread" value="500" class="w-full bg-[#1e2329] border border-[#2d3139] rounded px-3 py-1.5 text-slate-300 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">កាត់ចំណេញ TP ($)</label>
                        <input type="number" id="tp_usd" value="0.65" step="0.01" class="w-full bg-[#1e2329] border border-[#2d3139] rounded px-3 py-1.5 text-[#03c087] font-bold focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">កាត់ខាត SL ($)</label>
                        <input type="number" id="sl_usd" value="5.00" step="0.1" class="w-full bg-[#1e2329] border border-[#2d3139] rounded px-3 py-1.5 text-[#f6465d] font-bold focus:outline-none">
                    </div>
                </div>
                <div class="pt-2 flex justify-between items-center">
                    <span class="text-slate-400">ស្ថានភាព EA៖</span>
                    <button id="eaToggle" onclick="toggleEA()" class="bg-[#03c087]/10 text-[#03c087] border border-[#03c087]/20 px-3 py-1 rounded text-[10px] font-bold uppercase">ACTIVE</button>
                </div>
                <button id="regBtn" onclick="registerAccount()" class="w-full bg-[#ffb11a] hover:bg-[#e09600] text-black font-bold py-2.5 rounded text-xs uppercase tracking-wider transition-all">🚀 CONNECT & AUTO-TRADE</button>
            </div>
            <div class="lg:col-span-2 bg-[#12161a] border border-[#2d3139] p-5 rounded-lg flex flex-col justify-between shadow-lg">
                <h2 class="text-xs font-bold text-[#ffb11a] uppercase tracking-wider border-b border-[#2d3139] pb-2">📈 ACCOUNT OVERVIEW (REAL-TIME)</h2>
                <div class="grid grid-cols-2 gap-4 my-6">
                    <div class="bg-[#1e2329] p-5 rounded border border-[#2d3139]">
                        <p class="text-[10px] text-slate-400 uppercase tracking-wider">Account Balance</p>
                        <h3 id="balVal" class="text-2xl sm:text-3xl font-bold text-slate-100 mt-2 font-mono">$0.00</h3>
                    </div>
                    <div class="bg-[#1e2329] p-5 rounded border border-[#2d3139]">
                        <p class="text-[10px] text-[#03c087] uppercase tracking-wider">Account Equity</p>
                        <h3 id="eqVal" class="text-2xl sm:text-3xl font-bold text-[#03c087] mt-2 font-mono">$0.00</h3>
                    </div>
                </div>
                <div class="space-y-2">
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider">Active Trades & Logs</p>
                    <div id="positionsVal" class="p-3 bg-[#1e2329] text-xs text-emerald-400 rounded border border-[#2d3139] font-mono leading-relaxed h-28 overflow-y-auto">គ្មានការជួញដូរសកម្មឡើយ</div>
                </div>
            </div>
        </div>
    </main>
    <footer class="border-t border-[#2d3139] py-3 text-center text-[10px] text-slate-500 bg-[#12161a]">© 2026 BYBIT STYLE CLOUD TERMINAL.</footer>
    <script>
        let eaActive = 1;
        function toggleEA() {
            const btn = document.getElementById('eaToggle');
            if (eaActive === 1) { eaActive = 0; btn.innerText = "DISABLED"; btn.className = "bg-[#f6465d]/10 text-[#f6465d] border border-[#f6465d]/20 px-3 py-1 rounded text-[10px] font-bold uppercase"; }
            else { eaActive = 1; btn.innerText = "ACTIVE"; btn.className = "bg-[#03c087]/10 text-[#03c087] border border-[#03c087]/20 px-3 py-1 rounded text-[10px] font-bold uppercase"; }
        }
        function registerAccount() {
            const regBtn = document.getElementById('regBtn');
            regBtn.innerText = "SAVING SETTINGS TO CLOUD...";
            regBtn.disabled = true;
            const accId = document.getElementById('accId').value;
            const password_mt5 = document.getElementById('password_mt5').value;
            const server = document.getElementById('server').value;
            const platform = document.getElementById('platform').value;
            const lotSize = parseFloat(document.getElementById('lotSize').value);
            const tp_usd = parseFloat(document.getElementById('tp_usd').value);
            const sl_usd = parseFloat(document.getElementById('sl_usd').value);
            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accId, password_mt5, server, platform, lotSize, tp_usd, sl_usd })
            })
            .then(res => res.json())
            .then(data => {
                regBtn.innerText = "🚀 CONNECT & AUTO-TRADE";
                regBtn.disabled = false;
                alert(data.message);
            });
        }
        setInterval(() => {
            const accId = document.getElementById('accId').value;
            if(!accId) return;
            fetch(`/api/status-account/${accId}`)
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('balVal').innerText = `$${parseFloat(data.balance).toFixed(2)}`;
                    document.getElementById('eqVal').innerText = `$${parseFloat(data.equity).toFixed(2)}`;
                    document.getElementById('positionsVal').innerHTML = `<div>[TRADES]: ${data.positions}</div><div class="text-slate-400 mt-1">[LOGS]: ${data.log}</div>`;
                    const diff = data.serverTime - data.lastPing;
                    const light = document.getElementById('apiLight');
                    const text = document.getElementById('apiText');
                    if (diff < 6000) {
                        light.className = "w-2 h-2 rounded-full bg-[#03c087] shadow-lg shadow-[#03c087]/50";
                        text.innerText = "VPS BRIDGE: ACTIVE";
                        text.className = "text-[#03c087] font-semibold";
                    } else {
                        light.className = "w-2 h-2 rounded-full bg-[#f6465d] shadow-lg shadow-[#f6465d]/50 animate-pulse";
                        text.innerText = "VPS BRIDGE: FAILED";
                        text.className = "text-[#f6465d] font-semibold";
                    }
                }
            });
        }, 2000);
    </script>
</body>
</html>
